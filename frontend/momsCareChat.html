<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MomsCare Chatbot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="logo">MomsCare</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="motherDashboard.html">Mother Portal</a>
    </div>
  </nav>
  <main class="section">
    <h1>MomsCare – Ask Anything</h1>
    <div class="chat-card">
      <div class="field">
        <label>Your message</label>
        <textarea id="msg" rows="4" placeholder="Ask about nutrition, symptoms, appointments..."></textarea>
      </div>
      <button class="btn primary" onclick="askMomsCare()">Send</button>
      <div class="reply">
        <h4>Reply</h4>
        <p id="reply">I’m here to help. Share your question to begin.</p>
      </div>
    </div>
  </main>
  <script src="js/momsCareChat.js"></script>
</body>
</html>
