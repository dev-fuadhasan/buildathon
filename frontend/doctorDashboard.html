<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="logo">MomsCare Doctor</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#" id="logoutDoctor">Logout</a>
    </div>
  </nav>
  <main class="section">
    <h1>Doctor Portal</h1>
    <div class="dashboard-grid">
      <section class="card">
        <h3>Status</h3>
        <div id="doctorStatus">Loading...</div>
      </section>
      <section class="card">
        <h3>Patient Questions</h3>
        <div id="doctorQuestions"></div>
      </section>
      <section class="card">
        <h3>Availability</h3>
        <textarea id="availabilityInput" rows="3" placeholder='[{"day":"Mon","from":"10:00","to":"14:00"}]'></textarea>
        <button class="btn primary" id="btnUpdateAvailability">Save Availability</button>
      </section>
    </div>
  </main>
  <script src="js/doctorDashboard.js"></script>
</body>
</html>
