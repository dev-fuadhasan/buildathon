<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mother Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="logo">MomsCare</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="momsCareChat.html">Chatbot</a>
      <a href="#" id="logoutMother">Logout</a>
    </div>
  </nav>
  <main class="section">
    <h1>Mother Portal</h1>
    <div class="dashboard-grid">
      <section class="card">
        <h3>Your Profile</h3>
        <div id="motherProfile">Loading...</div>
        <button class="btn ghost" id="btnUpdateProfile">Update Profile</button>
      </section>

      <section class="card">
        <h3>Questions to Doctors</h3>
        <textarea id="questionInput" rows="3" placeholder="Describe your concern"></textarea>
        <button class="btn primary" id="btnAskDoctor">Send Question</button>
        <div id="questionList"></div>
      </section>

      <section class="card">
        <h3>Reminders</h3>
        <div class="row">
          <input id="reminderMessage" placeholder="Reminder message" />
          <input id="reminderDate" type="date" />
          <select id="reminderType">
            <option value="doctor_visit">Doctor Visit</option>
            <option value="supplement">Supplement</option>
            <option value="growth_update">Growth Update</option>
          </select>
          <button class="btn ghost" id="btnAddReminder">Add</button>
        </div>
        <ul id="reminderList"></ul>
      </section>

      <section class="card">
        <h3>Upload Prescription</h3>
        <input type="file" id="prescriptionFile" />
        <button class="btn primary" id="btnUpload">Upload</button>
        <ul id="uploadList"></ul>
      </section>
    </div>
  </main>
  <script src="js/motherDashboard.js"></script>
</body>
</html>
